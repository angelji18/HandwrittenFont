[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-font"
version = "0.1.0"
description = "Learn to extract handwritten glyphs from a known grid."
requires-python = ">=3.10"
dependencies = ["Pillow", "vtracer==0.6.11"]

[tool.setuptools.packages.find]
where = ["src"]
