[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-font"
version = "0.1.0"
description = "Learn to extract handwritten glyphs from a known grid."
requires-python = ">=3.9"
dependencies = ["Pillow"]

[tool.setuptools.packages.find]
where = ["src"]
